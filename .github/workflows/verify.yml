name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check the formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt reports these files:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - name: Run Unix shell helper tests
        run: |
          set -eu
          sh scripts/fetch-release_test.sh
          sh scripts/release-classify_test.sh
      - run: go build -o bin/herdr-canvas ./cmd/herdr-canvas
      - name: Compile the four release targets
        if: matrix.name == 'linux'
        run: |
          set -eu
          for pair in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            goos=${pair%/*}
            goarch=${pair#*/}
            echo "CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -o /tmp/herdr-canvas-"$goos"-"$goarch" ./cmd/herdr-canvas
          done
