id = "herdr-canvas"
name = "herdr-canvas"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Dead-simple ASCII diagram canvas"
platforms = ["linux", "macos"]

[[build]]
command = ["go", "build", "-o", "bin/herdr-canvas", "./cmd/herdr-canvas"]

# This step installs the prefix+d hotkey. The hotkey opens the canvas in a split
# beside the active pane, in the cwd of that pane. A second press closes it. herdr uses prefix+c for a new tab. This
# plugin uses prefix+d.
[[build]]
command = ["bin/herdr-canvas", "setup"]

[[actions]]
id = "open"
title = "Toggle herdr-canvas diagram"
contexts = ["workspace", "pane"]
command = ["bin/herdr-canvas", "launch"]

[[panes]]
id = "canvas"
title = "herdr-canvas"
placement = "split"
# The pane runs with --cwd set to the invoking repository, so a relative path
# does not resolve. HERDR_PLUGIN_ROOT is the only stable way to name the binary.
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-canvas\""]
