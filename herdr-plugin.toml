id = "herdr-canvas"
name = "herdr-canvas"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Dead-simple ASCII diagram canvas"
platforms = ["linux", "macos"]

[[build]]
command = ["go", "build", "-o", "bin/herdr-canvas", "./cmd/herdr-canvas"]

# This step installs the prefix+d hotkey. The hotkey opens the canvas in a new
# tab, in the cwd of the current pane. herdr uses prefix+c for a new tab. This
# plugin uses prefix+d.
[[build]]
command = ["bin/herdr-canvas", "setup"]

[[actions]]
id = "open"
title = "Open herdr-canvas diagram"
contexts = ["workspace", "pane"]
command = ["bin/herdr-canvas", "launch"]

[[panes]]
id = "canvas"
title = "herdr-canvas"
placement = "tab"
command = ["./bin/herdr-canvas"]
